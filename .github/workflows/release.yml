name: release

# Packages every chart whose directory changed, pushes it to GHCR as an OCI
# artifact, signs it with cosign (keyless) and records a build provenance
# attestation. Re-publishing an existing version is skipped, not overwritten:
# a pinned digest must not move.

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      chart:
        description: Chart name (empty = all)
        default: ""
      tag:
        description: Mint and publish this upstream tag instead of the pinned one (e.g. v1.6.2), without touching the pin or the tree
        default: ""

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  OCI_PATH: ghcr.io/ychan-alt/charts

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.plan.outputs.charts }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          set -euo pipefail
          want="${{ inputs.chart }}"
          if [ -n "$want" ]; then names="$want"; else names=$(ls charts); fi
          python3 -c 'import json,sys;print(json.dumps(sys.argv[1:]))' $names > /tmp/names.json
          echo "charts=$(cat /tmp/names.json)" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    if: needs.plan.outputs.charts != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.plan.outputs.charts) }}
    permissions:
      contents: write        # releases
      packages: write        # GHCR
      id-token: write        # cosign keyless (Fulcio cert)
      attestations: write    # build provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml

      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1

      - name: Install cosign (pinned)
        run: |
          set -euo pipefail
          ver=v3.1.4
          curl -fsSL -o /usr/local/bin/cosign \
            "https://github.com/sigstore/cosign/releases/download/${ver}/cosign-linux-amd64"
          chmod +x /usr/local/bin/cosign
          cosign version

      - name: Resolve the chart source
        id: src
        run: |
          set -euo pipefail
          name="${{ matrix.chart }}"
          tag="${{ inputs.tag }}"
          if [ -n "$tag" ]; then
            python3 tools/crdkit.py generate --chart "$name" --tag "$tag" --out /tmp/mint
            echo "dir=/tmp/mint/charts/$name" >> "$GITHUB_OUTPUT"
            echo "out=/tmp/mint" >> "$GITHUB_OUTPUT"
          else
            echo "dir=charts/$name" >> "$GITHUB_OUTPUT"
            echo "out=" >> "$GITHUB_OUTPUT"
          fi

      - name: Prove the chart still matches upstream before publishing
        run: |
          set -euo pipefail
          o="${{ steps.src.outputs.out }}"
          if [ -n "$o" ]; then o="--out $o"; fi
          python3 tools/crdkit.py verify --chart "${{ matrix.chart }}" $o
          python3 tools/crdkit.py render-check --chart "${{ matrix.chart }}" $o

      - name: Package
        id: package
        run: |
          set -euo pipefail
          name="${{ matrix.chart }}"
          dir="${{ steps.src.outputs.dir }}"
          mkdir -p dist
          helm package "$dir" -d dist
          tgz=$(ls dist/"$name"-*.tgz | head -1)
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Push (skip if the version already exists)
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="${{ steps.package.outputs.name }}"
          dir="${{ steps.src.outputs.dir }}"
          ver="$(python3 -c "import yaml,sys;print(yaml.safe_load(open(sys.argv[1]))['version'])" "$dir/Chart.yaml")"
          ref="$OCI_PATH/$name:$ver"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "${{ secrets.GHCR_TOKEN || github.token }}" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          if helm show chart "oci://$OCI_PATH/$name" --version "$ver" >/dev/null 2>&1; then
            echo "::notice::$ref already published — not overwriting"
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          helm push "${{ steps.package.outputs.tgz }}" "oci://$OCI_PATH" 2>&1 | tee /tmp/push.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'already exists|conflict' /tmp/push.log; then
            echo "::notice::$ref already exists in the registry — not overwriting (a pinned digest must not move)"
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          elif grep -q '403' /tmp/push.log; then
            echo "::error::GHCR refused this workflow's token. The package is not linked to the"
            echo "::error::repository (it was first published outside CI, which leaves it"
            echo "::error::user-scoped). Fix once, in the package settings: 'Connect repository'"
            echo "::error::→ this repo. Then GITHUB_TOKEN (packages: write) can publish and read."
            echo "::error::https://github.com/users/${{ github.repository_owner }}/packages/container/charts%2F$name/settings"
            echo "::error::Alternatively add a repo secret GHCR_TOKEN holding a PAT with write:packages."
            exit 1
          else
            echo "::error::helm push failed"
            exit 1
          fi

      - name: Sign (cosign, keyless)
        if: steps.push.outputs.fresh == 'true'
        run: cosign sign --yes "${{ steps.push.outputs.ref }}"

      - name: Provenance
        if: steps.push.outputs.fresh == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.push.outputs.ref }}

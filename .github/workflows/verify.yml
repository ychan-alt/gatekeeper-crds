name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: Prove the templates match the pinned upstream asset
        run: python3 tools/crdkit.py verify

      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1
      - name: Prove what helm actually renders matches upstream too
        run: python3 tools/crdkit.py render-check

      - name: helm lint
        run: |
          set -euo pipefail
          for c in charts/*/; do helm lint "$c"; done

      # No kubeconform here, on purpose: kubeconform has NO schema for
      # `CustomResourceDefinition`, so on a chart whose objects are all CRDs it
      # either skips every object (-ignore-missing-schemas → green while
      # validating nothing) or fails on perfectly valid manifests. The real
      # schema validation is the API server: `kubectl apply --server-side
      # --dry-run=server -f charts/*/templates/crds.yaml`, which needs a cluster
      # and is therefore a pre-flight step, not PR CI.


name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: Prove the templates match the pinned upstream asset
        run: python3 tools/crdkit.py verify

      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1
      - name: Prove what helm actually renders matches upstream too
        run: python3 tools/crdkit.py render-check

      # ---------------------------------------------------------------------
      # Additional validation steps (optional but recommended for prod‑ready)
      # ---------------------------------------------------------------------
      - name: Install kubeconform for schema validation
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Validate generated CRDs with kubeconform
        run: |
          kubeconform -strict -ignore-missing-schemas -summary gatekeeper-crds/charts/**/templates/*.yaml

      - name: Lint Helm chart with helm lint
        run: |
          helm lint gatekeeper-crds/charts/**

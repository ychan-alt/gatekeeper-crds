name: sync

# Watches the upstream projects for new tags, regenerates the charts, proves them
# against the downloaded asset, and opens a PR. Merging is manual: a schema change
# should pass a human, and the merge is what triggers `release`.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      chart:
        description: Chart name (empty = all)
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml

      - name: Which charts are behind upstream?
        id: check
        run: |
          set -euo pipefail
          python3 tools/crdkit.py check-upstreams --json > /tmp/upstreams.json
          cat /tmp/upstreams.json
          behind=$(python3 -c "import json;print(','.join(r['chart'] for r in json.load(open('/tmp/upstreams.json')) if r['update']))")
          echo "behind=${behind}" >> "$GITHUB_OUTPUT"
          echo "any=$([ -n "$behind" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Regenerate and verify
        if: steps.check.outputs.any == 'true'
        run: |
          set -euo pipefail
          python3 tools/crdkit.py generate --bump
          python3 tools/crdkit.py verify

      - name: Commit on a sync branch
        if: steps.check.outputs.any == 'true'
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="sync/${{ github.run_id }}"
          git checkout -B "$branch"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          title="$(git diff --cached -- sources/charts.yaml | grep -E '^\+.*current:' | head -1 | sed -E 's/.*current: //')"
          git commit -q -m "chore(sync): bump CRD charts to upstream $title" \
            -m "Generated by tools/crdkit.py and verified against the upstream asset." \
            -m "Charts: ${{ steps.check.outputs.behind }}"
          git push -f origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "Automated CRD sync for: **${{ steps.check.outputs.behind }}**"
            echo
            echo "Regenerated with \`tools/crdkit.py generate --bump\` and verified against the"
            echo "upstream asset in the same job, so every CRD in this PR is field-for-field"
            echo "the upstream one (modulo \`helm.sh/resource-policy: keep\`)."
            echo
            echo "<details><summary>Version changes</summary>"
            echo
            echo '```'
            git diff "origin/main...${{ steps.commit.outputs.branch }}" -- sources/charts.yaml | sed -n '1,40p'
            echo '```'
            echo "</details>"
            echo
            echo "Merging this triggers \`release\` (package, push to GHCR, cosign sign)."
          } > /tmp/body.md
          gh pr create --title "chore(sync): bump CRD charts" --body-file /tmp/body.md \
            --base main --head "${{ steps.commit.outputs.branch }}"
